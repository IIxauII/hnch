<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>hnch — planning poker</title>
  <meta name="description" content="Planning poker for agile teams. No account, no setup — share a code and estimate together." />

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <!-- Matches --hnch-bg per mode so the browser chrome blends into the app. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1C1C1E" />
  <!-- No maximum-scale / user-scalable=no: pinch-zoom stays available (WCAG 1.4.4). -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- .ico for browsers/crawlers that only probe /favicon.ico; SVG (adapts to dark mode) for the rest. -->
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="assets/icon/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="hnch" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

</body>

</html>
