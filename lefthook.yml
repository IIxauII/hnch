# Lefthook config — fast pre-commit guards for hnch.
#
# Format with biome, lint with oxlint, lint Angular templates with the
# trimmed @angular-eslint/template config. Lefthook matches CI: errors
# block, warnings flow through informationally.
#
# Skip via `LEFTHOOK=0 git commit ...` if needed (rare). Hooks are
# auto-installed on `pnpm install` via lefthook's own postinstall.

pre-commit:
  parallel: true
  jobs:
    - name: biome-format
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}'
      run: pnpm exec biome format --write {staged_files} && git add {staged_files}
    - name: oxlint
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: pnpm exec oxlint {staged_files}
    - name: angular-templates
      glob: 'packages/client/**/*.html'
      run: pnpm --filter @hnch/client exec eslint {staged_files}

commit-msg:
  commands:
    scope-check:
      run: bash scripts/check-commit-scope.sh {1}

# Screenshot CAPTURE + PUBLISH pre-push hook.
#
# THIS IS NOT A CI / e2e VERIFICATION STEP. It does not gate the push on test
# results. Its job is purely:
#   1. Run the visual screenshot suite under packages/e2e/tests/_screenshots/.
#   2. Push the resulting PNGs to the `screenshots` orphan branch under sha-<short>/.
#   3. Upsert a sticky PR comment with inline image embeds.
#
# It is NOT `pnpm test:e2e`, NOT the CI `verify` matrix, NOT a typecheck/lint.
# A green screenshot hook says nothing about whether the code works — only that
# the visual fixtures rendered without crashing Playwright. Skipped on
# merge/rebase pushes. Bypass with `git push --no-verify`.
#
# Best-effort EXCEPT for HEAD-invariant violations: if the publish script
# detects that it moved the invoking worktree's HEAD (a past bug — issue #335),
# it exits non-zero to gate the push. All other publish failures (playwright
# flake, push rejection, comment update error) still exit 0 in hook mode.
# See docs/plans/e2e-screenshot-coverage-expansion.md (Phase 3).
pre-push:
  commands:
    screenshots-capture-and-publish:
      run: node scripts/screenshot-publish.mjs --mode=hook
      skip:
        - merge
        - rebase
