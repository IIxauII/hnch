name: Deploy client (PWA)

# Triggered when semantic-release cuts a `client-vX.Y.Z` tag (see release.yml).
# Builds the production PWA once, then deploys it to hnch-web: Workers Static
# Assets (ADR-0051), with a Worker on page paths that answers Markdown to
# agents (ADR-0058); files never run it. Its hnch.dev/* route is inert
# until the switch (repo variable HNCH_LIVE != 'true'), so before it the job
# only checks the deploy took. The IONOS VPS gets no deploys (ADR-0054).
# Topology, release flow, rollback: docs/deployment.md.

on:
  # Dispatched explicitly by semantic-release's publishCmd in
  # packages/client/release.config.mjs (`gh workflow run deploy-client.yml --ref
  # client-vX.Y.Z`), which takes the defaults below. Tag-push events from PATs
  # are not reliably delivered to other workflows, so dispatch is the canonical
  # path. workflow_dispatch also lets an operator re-deploy from the Actions UI.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (defaults to current ref)'
        required: false
      allow_route_removal:
        description: 'Let this deploy remove a live hnch.dev route of hnch-web'
        type: boolean
        default: false

# Serialize deploys — separate group from relay so client + relay can deploy
# independently, but never two client deploys at once.
concurrency:
  group: deploy-client
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable Corepack
        # pnpm's version comes from `packageManager`.
        run: corepack enable

      - name: Install (cold)
        # A job that builds what users get restores no cache: the fresh
        # runner's empty store makes pnpm fetch every package and check it
        # against the lockfile. Only the client and what it depends on
        # (@hnch/shared); no install scripts (prebuild writes version.ts).
        run: |
          pnpm install --frozen-lockfile --ignore-scripts \
            --filter '@hnch/client...'

      - name: Build metadata
        # The web job checks out this exact commit, even if `ref` is a
        # branch that moves while the build runs. `tag` is client-vX.Y.Z only
        # when this commit is that release tag's commit (checkout fetches the
        # tag only when `ref` names it); an unreleased commit deploys untagged.
        id: meta
        run: |
          sha="$(git rev-parse HEAD)"
          version="$(node -p "require('./packages/client/package.json').version")"
          tag="client-v${version}"
          if [ "$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)" != "${sha}" ]; then
            tag=''
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${sha} as ${tag:-an unreleased commit (no tag)}"

      - name: Assert hnch-web config
        # Assets from ./www with SPA fallback, the Markdown Worker on page
        # paths only (ADR-0058) with Workers Logs off, no workers.dev or
        # preview URLs, every route on hnch.dev with a zone_id (the token has
        # no Zone: Read).
        working-directory: packages/client
        run: node scripts/deploy-guard.mjs config

      - name: Build @hnch/shared (consumed by client)
        run: pnpm --filter @hnch/shared run build

      - name: Build @hnch/client (production)
        env:
          NODE_ENV: production
        run: pnpm --filter @hnch/client run build

      - name: Post-build hygiene asserts
        # Hard-fail on source-map leak (unambiguous misconfig). Warn-only on
        # surviving console.log calls — Angular's terser strips them by
        # default, but minified third-party deps can produce false positives.
        # Flip to hard-fail once verified clean over a few real deploys.
        run: |
          set -euo pipefail
          if find packages/client/www -name '*.map' | grep -q .; then
            echo "ERROR: source maps leaked into production bundle" >&2
            find packages/client/www -name '*.map' >&2
            exit 1
          fi
          if grep -rIln 'console\.log' packages/client/www --include='*.js' | head -1 | grep -q .; then
            echo "WARNING: console.log calls survived minification" >&2
          fi
          du -sh packages/client/www
          find packages/client/www -name '*.js' -size +500k

      - name: Hash guard
        # _headers serves every .js and .css as immutable for a year, so each
        # must carry the build's content hash (`\.[0-9a-f]{16}\.(js|css)$`), and
        # _headers, robots.txt, sitemap.xml, index.md, openapi.json and
        # .well-known/api-catalog must sit at the root of www.
        working-directory: packages/client
        run: node scripts/deploy-guard.mjs www

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: www
          path: packages/client/www
          if-no-files-found: error
          # Long enough to re-run a failed web job the next days.
          retention-days: 7

  web:
    name: Deploy PWA to hnch-web
    needs: build
    # Holds the Cloudflare secrets; its rule: docs/deployment.md#environments.
    # The build job needs no secrets, so it stays outside.
    environment: cloudflare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable Corepack
        # pnpm's version comes from `packageManager`.
        run: corepack enable

      - name: Install (cold)
        # A job that holds the deploy token restores no cache: the fresh
        # runner's empty store makes pnpm fetch every package and check it
        # against the lockfile. Only the client's packages (wrangler for the
        # deploy and the guard); no install scripts.
        run: |
          pnpm install --frozen-lockfile --ignore-scripts \
            --filter @hnch/client

      - name: Clear www
        # Deploy exactly the uploaded build, nothing left in the workspace.
        run: rm -rf packages/client/www

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: www
          path: packages/client/www

      - name: Re-check config and www
        # The same guards as the build job, on what this job will upload.
        working-directory: packages/client
        run: |
          node scripts/deploy-guard.mjs config
          node scripts/deploy-guard.mjs www

      - name: Guard live routes
        # `wrangler deploy` deletes routes missing from the config: refuse
        # unless allow_route_removal.
        working-directory: packages/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOW_ROUTE_REMOVAL: ${{ inputs.allow_route_removal && 'true' || 'false' }}
        run: node scripts/deploy-guard.mjs live

      - name: Deploy
        working-directory: packages/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
          # wrangler records the new version id here; verify reads it.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        # Tagged only for a release commit; the message always names the commit.
        run: |
          rm -f "${WRANGLER_OUTPUT_FILE_PATH}"
          args=(--message "${TAG:-untagged} (${SHA})")
          if [ -n "${TAG}" ]; then
            args+=(--tag "${TAG}")
          fi
          pnpm exec wrangler deploy "${args[@]}"

      - name: Check the deploy took
        # The version this run uploaded serves 100 %, its message names this
        # commit, it carries the release tag (or none), and hnch.dev/* is live
        # for hnch-web. A re-dispatch of the same tag can't pass on the old
        # upload.
        working-directory: packages/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_TAG: ${{ needs.build.outputs.tag }}
          DEPLOY_SHA: ${{ needs.build.outputs.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: node scripts/deploy-guard.mjs verify

      - name: Smoke test hnch.dev
        # Only once the apex is proxied (Phase 3 sets HNCH_LIVE): this build's
        # index.html, served by Cloudflare, with one Cache-Control per response.
        if: vars.HNCH_LIVE == 'true'
        run: |
          main="$(basename packages/client/www/main.*.js)"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 https://hnch.dev/ | grep -q "${main}"; then
              echo "https://hnch.dev/ serves this build (attempt ${attempt})"
              break
            fi
            if [ "${attempt}" = 30 ]; then
              echo "::error::https://hnch.dev/ does not serve this build (${main})"
              exit 1
            fi
            sleep 2
          done
          failed=0
          check() {
            headers="$(curl -fsS --max-time 10 -D - -o /dev/null "https://hnch.dev$1" | tr -d '\r')"
            values="$(printf '%s\n' "${headers}" | grep -i '^cache-control:' | sed 's/^[^:]*: *//')"
            if [ "${values}" != "$2" ]; then
              echo "::error::$1 Cache-Control '${values}', expected exactly '$2'"
              failed=1
            fi
            if ! printf '%s\n' "${headers}" | grep -qi '^cf-ray:'; then
              echo "::error::$1 is not served by Cloudflare"
              failed=1
            fi
          }
          # An agent asking for Markdown gets it on the root and on a deep link,
          # which only run_worker_first's glob sends to the Worker (ADR-0058).
          # The HTML check above already sent the default Accept.
          for path in / /lobby/x; do
            md="$(curl -fsS --max-time 10 -D - -o /dev/null -H 'Accept: text/markdown' \
              "https://hnch.dev${path}" | tr -d '\r')"
            md_type="$(printf '%s\n' "${md}" | grep -i '^content-type:' | sed 's/^[^:]*: *//')"
            if [ "${md_type}" != 'text/markdown; charset=utf-8' ]; then
              echo "::error::${path} with Accept: text/markdown answers '${md_type}', expected text/markdown"
              failed=1
            fi
            if ! printf '%s\n' "${md}" | grep -qiE '^vary:(.*[ ,])?accept *(,|$)'; then
              echo "::error::${path} Markdown answer lacks Vary: Accept"
              failed=1
            fi
          done
          check / 'no-cache, must-revalidate'
          # RFC 9727 discovery: the homepage links agents to the API catalog.
          if ! curl -fsS --max-time 10 -D - -o /dev/null https://hnch.dev/ | tr -d '\r' \
            | grep -qiE '^link:.*</\.well-known/api-catalog>; *rel="?api-catalog"?'; then
            echo "::error::/ has no Link to /.well-known/api-catalog (rel=api-catalog)"
            failed=1
          fi
          check /lobby/x 'no-cache, must-revalidate'
          check /3rdpartylicenses.txt 'no-cache, must-revalidate'
          check "/${main}" 'public, max-age=31536000, immutable'
          # _headers configures the Worker; it must not be served itself.
          check /_headers 'no-cache, must-revalidate'
          if ! curl -fsS --max-time 10 https://hnch.dev/_headers | grep -q '<app-root'; then
            echo "::error::/_headers is served as a file, expected the SPA index.html"
            failed=1
          fi
          # served_file <file> <Content-Type regex> <expected, for the error>:
          # /<file> is this build's www/<file>, with a Content-Type matching the
          # regex. Without the file the SPA fallback answers index.html with a
          # 200. The step runs under `bash -e`, so a failed curl is caught here
          # rather than ending the step before the remaining checks.
          served_file() {
            check "/$1" 'no-cache, must-revalidate'
            local body="${RUNNER_TEMP}/served-${1//\//-}" content_type
            if ! content_type="$(curl -fsS --max-time 10 -o "${body}" -w '%{content_type}' "https://hnch.dev/$1")"; then
              echo "::error::/$1 did not answer"
              failed=1
              return
            fi
            if [[ ! "${content_type}" =~ $2 ]]; then
              echo "::error::/$1 is '${content_type}', expected $3"
              failed=1
            fi
            if ! cmp -s "${body}" "packages/client/www/$1"; then
              echo "::error::/$1 is not this build's www/$1"
              failed=1
            fi
          }
          # Crawlers read a text/html answer as no robots.txt.
          served_file robots.txt '^text/plain' text/plain
          served_file sitemap.xml '^(application|text)/xml' 'an XML type'
          # RFC 9727: the API catalog is Linkset JSON, the spec it links to is JSON.
          served_file .well-known/api-catalog '^application/linkset\+json' application/linkset+json
          served_file openapi.json '^application/(json|vnd\.oai\.openapi\+json)' 'a JSON type'
          # RFC 9727 §2: a HEAD of the catalog carries a Link with rel=api-catalog.
          if ! curl -fsSI --max-time 10 https://hnch.dev/.well-known/api-catalog \
            | tr -d '\r' | grep -qiE '^link:.*rel="?api-catalog'; then
            echo "::error::HEAD /.well-known/api-catalog lacks a Link with rel=api-catalog"
            failed=1
          fi
          exit "${failed}"
