name: Screenshots (main refresh)

# Refreshes docs/screenshots/<sha>/ on push to main when UI-bearing surfaces
# change. Commits PNGs back to main under docs/screenshots/<sha>/, updates the
# docs/screenshots/latest symlink, prunes to the newest 10 sha dirs.
#
# Discovery contract: skills (/triage, /plan, /spec, /critique) read from
# https://github.com/IIxauII/hnch/blob/main/docs/screenshots/latest/<topic>/<file>.png?raw=true
# as the canonical "what the app looks like now" reference.
#
# Loop guard: paths-ignore excludes docs/screenshots/** so the bot's own
# commit does not refire the workflow. The commit message also carries
# `[skip ci]` as belt-and-suspenders.
#
# Plan: docs/plans/e2e-screenshot-coverage-expansion.md (Phase 2).

on:
  push:
    branches: [main]
    paths:
      - 'packages/client/**'
      - 'packages/shared/**'
      - 'packages/e2e/tests/_screenshots/**'
      - 'packages/e2e/tests/fixtures/**'
    # Loop guard is the `[skip ci]` trailer on the bot's commit (GitHub Actions
    # honors it for push events). docs/screenshots/** is not in the include
    # globs above, so the bot's own changes can't refire this workflow anyway.

# Serialize so two pushes can't race the commit + non-fast-forward each other.
concurrency:
  group: screenshots-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Capture and commit
    # Runs Playwright + the built client + relay on its own hosted VM, so it
    # shares no CPUs with ci.yml's e2e job (ADR-0056).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          # Use the default GITHUB_TOKEN to push back; permissions:contents:write
          # above grants the scope.
          persist-credentials: true

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install workspace deps
        uses: ./.github/actions/pnpm-install

      - name: Install Playwright browsers
        run: pnpm --filter @hnch/e2e exec playwright install --with-deps chromium

      - name: Build @hnch/shared (consumed by relay + client webServers)
        run: pnpm --filter @hnch/shared run build

      - name: Capture screenshots
        env:
          SCREENSHOT_CAPTURE: '1'
          SCREENSHOT_SHA: sha-${{ steps.sha.outputs.short }}
          CI: 'true'
        run: |
          pnpm --filter @hnch/e2e exec playwright test _screenshots \
            --project=chromium --workers=1 --reporter=list

      - name: Update latest symlink
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          cd docs/screenshots
          if [ ! -d "sha-${SHORT}" ]; then
            echo "::error::expected docs/screenshots/sha-${SHORT}/ after capture, not found"
            ls -la
            exit 1
          fi
          ln -sfn "sha-${SHORT}" latest

      - name: Prune to newest 10 sha dirs
        run: |
          set -euo pipefail
          cd docs/screenshots
          # Drop the newest 10 sha-* dirs by mtime; rm the rest. Uses find
          # rather than `ls` so non-alphanumeric filenames are safe (shellcheck
          # SC2012). The runner is Linux, so GNU find's `-printf` is there.
          find . -maxdepth 1 -type d -name 'sha-*' -printf '%T@ %P\n' \
            | sort -rn \
            | tail -n +11 \
            | cut -d' ' -f2- \
            | xargs -r rm -rf

      - name: Commit and push
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "chore(screenshots): refresh @ sha-${SHORT} [skip ci]"
          # Rebase-on-push retry in case another push to main landed during capture.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected; fetching + rebasing (attempt ${attempt})."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push screenshot refresh after 3 attempts."
          exit 1
