name: Runner health

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Note: this workflow uses RUNNER_HEALTH_PAT (a fine-grained PAT with
# Administration: Read on this repo) instead of secrets.GITHUB_TOKEN.
# Listing self-hosted runners requires Administration: read, which
# GITHUB_TOKEN cannot be granted — its scope is capped by GitHub and
# cannot be escalated via the workflow `permissions:` block.
# See infra/README.md "Health check" for setup + rotation procedure.

concurrency:
  group: runner-health
  cancel-in-progress: true

jobs:
  check:
    name: Check hnch-podman runner pool
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check hnch-podman pool and e2e slot online
        env:
          GH_TOKEN: ${{ secrets.RUNNER_HEALTH_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::RUNNER_HEALTH_PAT secret not set — skipping health check"
            exit 0
          fi
          runners=$(gh api /repos/${{ github.repository }}/actions/runners)
          # Online runners carrying every label passed as an argument.
          online_with() {
            jq --args '[.runners[] | select(.status=="online" and ([.labels[].name] as $have | $ARGS.positional - $have | length == 0))] | length' "$@" <<<"$runners"
          }
          pool=$(online_with hnch-podman)
          e2e=$(online_with hnch-podman e2e)
          echo "Online: ${pool} hnch-podman runner(s), ${e2e} with the e2e label"
          failed=0
          [ "$pool" -ge 1 ] || { echo "::error::No hnch-podman runners online"; failed=1; }
          # ADR-0052: one e2e slot (hnch-runner-1-*). Without it, e2e jobs queue forever.
          [ "$e2e" -ge 1 ] || { echo "::error::No online hnch-podman runner carries the e2e label (slot 1 down or mislabeled); e2e jobs will queue"; failed=1; }
          exit "$failed"
