name: Runner health

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Note: this workflow uses RUNNER_HEALTH_PAT (a fine-grained PAT with
# Administration: Read on this repo) instead of secrets.GITHUB_TOKEN.
# Listing self-hosted runners requires Administration: read, which
# GITHUB_TOKEN cannot be granted — its scope is capped by GitHub and
# cannot be escalated via the workflow `permissions:` block.
# See infra/README.md "Health check" for setup + rotation procedure.

concurrency:
  group: runner-health
  cancel-in-progress: true

jobs:
  check:
    name: Check hnch-podman runner pool
    runs-on: ubuntu-latest
    # Five looks 30 s apart take 2 min at most; a healthy pool passes on the first.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false

      # scripts/ci/runner-health.mjs holds the rules: a busy runner counts as
      # present, and a check fails only when every look misses, since an
      # ephemeral runner is gone for 10-30 s after each job. A missing e2e slot
      # fails on its own. Each look logs the runner list.
      - name: Check hnch-podman pool and e2e slot online
        env:
          GH_TOKEN: ${{ secrets.RUNNER_HEALTH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::RUNNER_HEALTH_PAT secret not set — skipping health check"
            exit 0
          fi
          node scripts/ci/runner-health.mjs
