name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      relay: ${{ steps.filter.outputs.relay }}
      client: ${{ steps.filter.outputs.client }}
      cli: ${{ steps.filter.outputs.cli }}
      e2e: ${{ steps.filter.outputs.e2e }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # Defensive: if base is unset/zero (first push, force-push), assume everything changed.
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "No usable base SHA; treating as full-pipeline run."
            for v in shared relay client cli e2e root; do
              echo "$v=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          changed=$(git diff --name-only "$base"...HEAD)
          echo "Changed files since $base:"
          echo "$changed"

          match() { echo "$changed" | grep -qE "$1"; }

          root=false
          shared=false
          relay=false
          client=false
          cli=false
          e2e=false

          if match '^(pnpm-lock\.yaml|package\.json|tsconfig.*\.json|\.github/workflows/)'; then
            root=true
          fi
          match '^packages/shared/' && shared=true || true
          match '^packages/relay/'  && relay=true  || true
          match '^packages/client/' && client=true || true
          match '^packages/cli/'    && cli=true    || true
          match '^packages/e2e/'    && e2e=true    || true

          # Reverse-deps: shared change fans into all consumers.
          if [[ "$shared" == "true" ]]; then
            relay=true; client=true; cli=true; e2e=true
          fi
          # client or relay change requires e2e.
          if [[ "$client" == "true" || "$relay" == "true" ]]; then
            e2e=true
          fi
          # Root files force the full pipeline.
          if [[ "$root" == "true" ]]; then
            shared=true; relay=true; client=true; cli=true; e2e=true
          fi

          for v in shared relay client cli e2e root; do
            echo "$v=${!v}" >> "$GITHUB_OUTPUT"
          done

  verify:
    name: Verify (${{ matrix.package }})
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-latest"]') }}
    needs: detect-changes
    # Job-level gate: lane is skipped at matrix-expansion time when its
    # package didn't change (no runner slot consumed, status reflects "skipped"
    # honestly — branch protection should target the `Verify` summary job below,
    # not individual lane checks).
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ((matrix.package == 'shared' && needs.detect-changes.outputs.shared == 'true') || (matrix.package == 'relay' && needs.detect-changes.outputs.relay == 'true') || (matrix.package == 'client' && needs.detect-changes.outputs.client == 'true') || (matrix.package == 'cli' && needs.detect-changes.outputs.cli == 'true')) }}
    timeout-minutes: 20
    concurrency:
      group: verify-${{ github.ref }}-${{ matrix.package }}
      cancel-in-progress: true
    strategy:
      fail-fast: true
      matrix:
        package: [shared, relay, client, cli]
    steps:
      - name: Runner identity
        run: |
          echo "Runner: $RUNNER_NAME on $(hostname) — arch $(uname -m)"
          df -h /cache || true

      - uses: actions/checkout@v4

      # setup-node + corepack run unconditionally so the ubuntu-latest fallback
      # (vars.LINUX_RUNNER unset or rolled back) keeps working. On the self-hosted
      # image Node 22 + pnpm are already baked in; these steps are idempotent.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build @hnch/shared (consumed by other packages)
        run: pnpm --filter @hnch/shared run build

      - name: Typecheck
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present typecheck

      - name: Lint
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present lint

      - name: Unit tests
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present test

      - name: Build
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present build

  # Aggregator for the verify matrix. Branch-protection rules (when configured)
  # should target this `Verify` check, not individual lanes. Passes when every
  # matrix lane either succeeded or was skipped; fails when any lane actually
  # failed/cancelled. This keeps the matrix gate honest (skipped is "skipped",
  # not fake-passed) while still giving branch protection a single target.
  verify-summary:
    name: Verify
    runs-on: ubuntu-latest
    needs: verify
    if: always()
    steps:
      - name: Aggregate matrix result
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
        run: |
          case "$MATRIX_RESULT" in
            success|skipped)
              echo "verify matrix: $MATRIX_RESULT — OK"
              exit 0
              ;;
            *)
              echo "::error::verify matrix: $MATRIX_RESULT"
              exit 1
              ;;
          esac

  version-audit:
    name: Version audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need tags so the audit script can compare package.json versions
          # against the highest released tag per package.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit per-package versions vs git tags
        run: pnpm audit:versions

  pr-title-lint:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-latest"]') }}
    needs: [detect-changes, verify]
    if: needs.detect-changes.outputs.e2e == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 30
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # setup-node + corepack run unconditionally so the ubuntu-latest fallback
      # (vars.LINUX_RUNNER unset or rolled back) keeps working. On the self-hosted
      # image Node 22 + pnpm are already baked in; these steps are idempotent.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      # On self-hosted (rootless container, no sudo) Playwright system deps are
      # baked into the image — plain `install chromium` is enough. On ubuntu-latest
      # we still need apt-get via `--with-deps`.
      - name: Install Playwright browsers (github-hosted)
        if: runner.environment == 'github-hosted'
        run: pnpm --filter @hnch/e2e exec playwright install --with-deps chromium

      - name: Install Playwright browsers (self-hosted)
        if: runner.environment == 'self-hosted'
        run: pnpm --filter @hnch/e2e exec playwright install chromium

      - name: Build @hnch/shared (consumed by relay + client webServers)
        run: pnpm --filter @hnch/shared run build

      - name: Run e2e
        run: pnpm --filter @hnch/e2e test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          retention-days: 7
