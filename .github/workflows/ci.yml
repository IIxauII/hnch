name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The run's only first-wave job: change detection plus the checks that need
  # neither an install nor a package lane (CI script tests, workflow policy,
  # version audit, PR title). A failed check here fails this job, so
  # the lanes after it skip; the run still goes red. On a main push it may also
  # find the merge already verified by its PR run and turn every lane off
  # (verified-skip, ADR-0055); PR runs upload the evidence for that. Its
  # `screenshots` output says whether the change touched a UI-bearing path: on
  # a main push the e2e job then also captures main's screenshot reference set
  # (ADR-0057).
  #
  # Every job runs on GitHub-hosted ubuntu-24.04-arm (ADR-0056). The
  # workflow policy step below fails on any non-hosted runner label.
  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-24.04-arm
    # The checkout below is full-history and the pack is dominated by the
    # docs/screenshots/** PNGs main carried until #597 (they stay in history).
    # At timeout-minutes: 1 the job started dying mid-fetch (successful runs
    # were already landing at 40-53s). 3 minutes is headroom on top of the
    # blob filter, not a licence for the step to get slower.
    timeout-minutes: 3
    # Job-level permissions replace the workflow-level set, so contents: read
    # is restated. actions: read lets the filter step look up the last green
    # CI run on main and, for verified-skip, the PR run and its artifact;
    # pull-requests: read lets it find the merged PR, and the title check read
    # the PR's current title.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      relay: ${{ steps.filter.outputs.relay }}
      client: ${{ steps.filter.outputs.client }}
      cli: ${{ steps.filter.outputs.cli }}
      e2e: ${{ steps.filter.outputs.e2e }}
      root: ${{ steps.filter.outputs.root }}
      screenshots: ${{ steps.filter.outputs.screenshots }}
      verify-packages: ${{ steps.filter.outputs.verify-packages }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required: the filter step diffs base...head and
          # needs the merge-base. blob:none makes that a treeless partial
          # clone -- commits and trees, no file contents -- which is all the
          # path-only diff below reads. Drops the fetch from ~250 MiB of
          # screenshot blobs to ~1 MiB. NOTE: the diff MUST pass --no-renames,
          # or git's similarity detection lazy-fetches every changed blob back
          # from the promisor remote and the filter buys nothing.
          fetch-depth: 0
          filter: blob:none
          # The version audit compares against the release tags. fetch-depth: 0
          # already fetches refs/tags/*; this keeps them if the depth changes.
          fetch-tags: true

      # The scripts below are plain Node; no install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # A wrong rule here skips lanes or passes a bad title silently and goes
      # green, so the scripts are tested before they are used. Built-in
      # node:test, no install.
      - name: Test CI scripts
        run: node --test 'scripts/ci/*.test.mjs'

      # Hosted runners only, actions pinned to a SHA, npm pinned (ADR-0056).
      # Annotates each offending line.
      - name: Workflow policy
        run: node scripts/ci/workflow-policy.mjs

      - id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # Every lane on. The ::warning:: annotation makes a fallback visible
          # on the run summary (a lost actions: read, a broken API, rewritten
          # history).
          full_pipeline() {
            echo "$1"
            echo "::warning::$1"
            node scripts/ci/changed-lanes.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          }

          # 0 only when the verified-tree check below passed on a main push.
          verified=3

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            # Diff against the PR head SHA explicitly. actions/checkout for
            # pull_request events checks out `pull/N/merge` (a synthetic merge
            # of base+head). When the PR's branch content is already in main
            # (e.g. a parallel PR from the same branch was merged first), the
            # merge ref collapses to base and `base...HEAD` reports zero files —
            # which causes detect-changes to skip every lane on a real PR.
            head="${{ github.event.pull_request.head.sha }}"
            main_push=false
          elif [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            # Push to main: diff from the last GREEN main run, not from
            # github.event.before. The workflow-level concurrency group cancels
            # an older main run when a newer merge lands; diffing only
            # before..sha would then skip the cancelled merge's lanes and go
            # green without ever testing it. Diffing from the last green run
            # covers every cancelled or failed merge since.
            # - The current run is in progress, not success, so the query
            #   never returns it.
            # - A failed run never becomes the base, so the next run re-tests
            #   its changes.
            # - semantic-release's version bumps (chore(release): <tag>
            #   [skip ci], which touch packages/<pkg>/package.json and
            #   CHANGELOG.md) start no CI run of their own. They fall inside
            #   base..head, so the diff below is built per commit and leaves
            #   them out; otherwise a docs-only merge after a release would
            #   re-run that package's lanes.
            # - No green run found, gh failing, or a base that is not an
            #   ancestor of this push (history rewritten): full pipeline.
            # - A green run is the base even when it was a verified-skip: the
            #   PR run tested its tree.
            main_push=true
            head="${{ github.sha }}"
            base=""
            last_url=""
            why="no last green main run found"
            if last=$(timeout 30 gh api \
                "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0] | select(. != null) | "\(.head_sha) \(.html_url)"'); then
              read -r base last_url <<< "$last" || true
            else
              why="querying the last green main run failed"
            fi
            if [[ -z "$base" ]]; then
              full_pipeline "fallback: full pipeline ($why)"
            fi
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "Base SHA $base not in local clone; fetching."
              timeout 30 git fetch --no-tags origin "$base" || true
            fi
            if ! git merge-base --is-ancestor "$base" "$head" 2>/dev/null; then
              full_pipeline "fallback: full pipeline (last green main run $last_url at $base is not an ancestor of $head)"
            fi
            echo "Base: last green main run $last_url ($base)"

            # Verified-skip (ADR-0055): a squash merge whose tree a green PR
            # run tested on this same parent, with only [skip ci] bot commits
            # since the last green main run, needs no second test run. The
            # script prints why not, as a ::warning:: when a lookup failed; any
            # status but 0 runs the lanes, so an error never skips. The
            # changed paths are still listed below: a verified-skip run with
            # UI changes captures the screenshot reference (ADR-0057), which
            # no PR run does.
            verified=0
            node scripts/ci/verified-tree.mjs check "$head" "$base" || verified=$?
            if [[ "$verified" != 0 && "$verified" != 3 ]]; then
              echo "::warning::verified-tree check exited $verified; running the lanes"
            fi
          else
            # Unreachable today: the workflow triggers only on pull_request
            # and push to main. Kept as a guard should another trigger be
            # added; it falls back to diffing the push's own range.
            main_push=false
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # Defensive, for the guard branch above: an unset or zero base (e.g.
          # a new branch's first push) gives nothing to diff against, so run
          # everything.
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            full_pipeline "No usable base SHA; treating as full-pipeline run."
          fi

          # Defensive: fork PRs don't auto-fetch the head SHA via refs/heads/*.
          # Fetch it on demand so the diff resolves.
          if ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            echo "Head SHA $head not in local clone; fetching."
            git fetch --no-tags origin "$head" || true
          fi

          # --no-renames: keeps this a tree-only diff so the blob:none partial
          # clone above never has to lazy-fetch file contents. Rename detection
          # would only ever collapse an old+new path pair into the new path,
          # and for a path-prefix lane filter the extra old path is harmless.
          if [[ "$main_push" == "true" ]]; then
            # Per commit, minus the [skip ci] release commits (see above),
            # matched on the subject only, as release.yml does: a body line
            # must not drop a human commit's files. main is squash-only and so
            # linear. Still tree-only: diff-tree --name-only never reads blobs.
            # Keep BOT_SUBJECT in step with release.yml and scripts/ci/verified-tree.mjs
            # (a test there checks all three).
            BOT_SUBJECT='^chore\(release\): .*\[skip ci\]$'
            # An assignment, not < <(...): errexit sees a failing git log.
            commits=$(git log --format='%H %s' "$base..$head")
            changed=""
            while read -r c subject; do
              [[ -z "$c" || "$subject" =~ $BOT_SUBJECT ]] && continue
              changed+=$(git diff-tree -r --no-commit-id --name-only --no-renames "$c")$'\n'
            done <<< "$commits"
            changed=$(sed '/^$/d' <<< "$changed" | sort -u)
          else
            changed=$(git diff --name-only --no-renames "$base"..."$head")
          fi
          echo "Changed files between $base and $head:"
          echo "$changed"

          # The path rules (lanes, reverse-dep fan-out, Markdown at a package
          # root starting nothing, the screenshot paths) live in the script.
          # verify-packages lists only the lanes that run, so unrelated
          # `Verify (X)` checks don't appear at all; branch protection targets
          # the `Verify` aggregator. A verified skip turns every lane off and
          # keeps only the screenshot rule.
          if [[ "$verified" == 0 ]]; then
            node scripts/ci/changed-lanes.mjs --none <<< "$changed" >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/changed-lanes.mjs <<< "$changed" >> "$GITHUB_OUTPUT"
          fi

      # The checks below run even when an earlier step failed, so one run
      # reports every problem. Both read only the checkout: the four
      # package.json files are in the working tree and the tags came with the
      # clone, so nothing is installed or fetched.

      # semantic-release owns the package.json versions; a hand bump fails.
      - name: Audit package versions against release tags
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/audit-versions.mjs

      # The squash merge makes the PR title the commit on main, so it drives
      # the release. The title is read from the API, not the event payload, so
      # re-running the job after fixing the title checks the new one; editing
      # the title starts no run (no `edited` trigger).
      - name: PR title (Conventional Commits)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if ! PR_TITLE=$(timeout 30 gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .title); then
            echo "::warning::Could not read the current PR title; checking the title from the event instead."
            PR_TITLE="$EVENT_TITLE"
          fi
          export PR_TITLE
          node scripts/ci/pr-title.mjs

      # Evidence for verified-skip (ADR-0055): the tree this run tests (the
      # pull/N/merge checkout), the base tip it was merged on, and the PR head.
      # Only when that base is the one the lane diff above started from, or
      # that one plus the bot's [skip ci] commits (base.sha goes stale when they
      # land), so the lanes this run picked cover the squash commit's changes.
      # The main push run of the squash merge reads it from the PR head's
      # newest completed run, and only if that run concluded success. When the
      # checkout is not that merge it uploads an `unrecorded` marker, so main
      # misses quietly. Fork PRs record nothing: a fork's run uses the
      # workflow file from the fork, so its evidence proves nothing, and the
      # main push run of its merge runs every lane its diff touches.
      # Last in the job, so a failed check above uploads nothing. A re-run
      # records the same merge again: it reuses the run's merge commit.
      - name: Record the tested tree
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci/verified-tree.mjs record "$RUNNER_TEMP/verified-tree/verified-tree.json"

      - name: Upload the tested tree
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-tree
          path: ${{ runner.temp }}/verified-tree/verified-tree.json
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

  verify:
    name: Verify (${{ matrix.package }})
    runs-on: ubuntu-24.04-arm
    needs: detect-changes
    # Skip the job when no lane's package changed. Fork PRs run it too, on
    # hosted runners and without secrets (no Codecov token: the upload is
    # tokenless for forks and never fails the job).
    if: needs.detect-changes.outputs.verify-packages != '[]'
    # A hang guard, not a budget. The client lane took 2-3.5 min with coverage
    # on the old pool; hosted runners add the store restore and, while the
    # repo is private, run on 2 CPUs instead of 4.
    timeout-minutes: 10
    concurrency:
      group: verify-${{ github.ref }}-${{ matrix.package }}
      cancel-in-progress: true
    strategy:
      fail-fast: true
      # Matrix is computed dynamically from detect-changes — only lanes for
      # changed packages exist. Status checks for unrelated lanes don't appear
      # in the PR (cleaner than fake-passed). The `verify-summary` aggregator
      # below is the single check branch protection should target. e2e has
      # no lane: the e2e job checks its own package (see there).
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.verify-packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        uses: ./.github/actions/pnpm-install
        with:
          ignore-scripts: 'true'

      - name: Build @hnch/shared (consumed by other packages)
        run: pnpm --filter @hnch/shared run build

      - name: Typecheck
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present typecheck

      - name: Format check
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present format:check

      - name: Lint
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present lint

      - name: Lint templates
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present lint:templates

      # Every run measures coverage: PR runs feed Codecov's PR comment and its
      # codecov/patch check, main runs its history and the README badge. The
      # relay lane records PSI, load and CPU times while its tests run, to
      # tell a stalled runner from a slow test (#568).
      - name: Unit tests (with coverage)
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [[ "$PACKAGE" == relay ]]; then
            scripts/ci/with-stall-sampler.sh "$RUNNER_TEMP/stall-samples" \
              pnpm --filter ./packages/relay run test:coverage
          else
            pnpm --filter "./packages/$PACKAGE" run --if-present test:coverage
          fi

      - name: Upload stall samples
        if: always() && matrix.package == 'relay'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stall-samples-relay
          path: ${{ runner.temp }}/stall-samples/
          if-no-files-found: ignore
          retention-days: 14

      # Codecov is the only copy of the report; no workflow artifact, as
      # nothing read it.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.package }}
          files: packages/${{ matrix.package }}/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

      - name: Build
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present build

  # Aggregator for the verify matrix. Branch-protection rules (when configured)
  # should target this `Verify` check, not individual lanes. Passes when every
  # matrix lane either succeeded or was skipped; fails when any lane actually
  # failed/cancelled. This keeps the matrix gate honest (skipped is "skipped",
  # not fake-passed) while still giving branch protection a single target.
  # A failed detect-changes (lane rules, version audit, PR title) skips every
  # lane, so it fails this check too rather than reading as all-skipped. An
  # e2e-only change has an empty matrix and passes here, as does a
  # verified-skip main run (ADR-0055); `E2E (Playwright)` is the other merge
  # check and does not wait for this one.
  verify-summary:
    name: Verify
    runs-on: ubuntu-24.04-arm
    needs: [detect-changes, verify]
    if: always()
    timeout-minutes: 1
    steps:
      - name: Aggregate matrix result
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          MATRIX_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$DETECT_RESULT" != success ]]; then
            echo "::error::detect-changes: $DETECT_RESULT, so no verify lane ran"
            exit 1
          fi
          case "$MATRIX_RESULT" in
            success|skipped)
              echo "verify matrix: $MATRIX_RESULT — OK"
              exit 0
              ;;
            *)
              echo "::error::verify matrix: $MATRIX_RESULT"
              exit 1
              ;;
          esac

  e2e:
    name: E2E (Playwright)
    # One job, not shards (ADR-0056): each hosted job gets its own VM, so no
    # other job shares its CPUs, and a shard would repeat the install, the
    # browser install and the client build. `E2E (Playwright)` is the merge
    # check by this name.
    runs-on: ubuntu-24.04-arm
    # Starts beside the verify lanes, not after them: it builds @hnch/shared
    # itself and reads no lane output. A red lane does not stop e2e; both
    # checks must be green to merge. Fork PRs run it too, without secrets.
    #
    # On a main push that changed a UI-bearing path, the same Playwright run
    # also captures main's screenshot reference set (ADR-0057):
    # SCREENSHOT_CAPTURE unlocks the specs under tests/_screenshots, which PR
    # runs skip. The set goes up as an artifact for the screenshots-reference
    # job below; this job never holds a write token. A verified-skip main run
    # (ADR-0055) with UI changes runs here too, capture only.
    needs: detect-changes
    if: needs.detect-changes.outputs.e2e == 'true' || (github.event_name == 'push' && needs.detect-changes.outputs.screenshots == 'true')
    # A hang guard. 4.5-7 min on the old pool; hosted adds the browser's
    # system packages, and while the repo is private the runner has 2 CPUs.
    # A main run with capture adds the 21 screenshot specs.
    timeout-minutes: 25
    # A capture-only run (verified skip, UI change) may fail at any step, the
    # install or the browser download included, without turning main red: the
    # tree is verified, only the reference is missed. On every other run,
    # PRs included, the job fails as before.
    continue-on-error: ${{ needs.detect-changes.outputs.e2e != 'true' }}
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    env:
      E2E: ${{ needs.detect-changes.outputs.e2e }}
      CAPTURE: ${{ github.event_name == 'push' && needs.detect-changes.outputs.screenshots == 'true' }}
    outputs:
      # sha-<short> of the reference set this run captured; empty when none.
      reference: ${{ steps.reference.outputs.set }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # E2E keeps default ignore-scripts=false: msgpackr-extract's native
      # binary is exercised by the relay + client at runtime.
      - name: Install
        uses: ./.github/actions/pnpm-install

      - name: Build @hnch/shared (consumed by relay + client webServers)
        run: pnpm --filter @hnch/shared run build

      # The e2e package's own checks (it has no verify lane). They come before
      # Playwright so a broken spec fails in seconds. Playwright itself does
      # not typecheck, so it would let an undefined import through.
      - name: Typecheck (e2e)
        run: pnpm --filter @hnch/e2e run typecheck

      - name: Format check (e2e)
        run: pnpm --filter @hnch/e2e run format:check

      - name: Lint (e2e)
        run: pnpm --filter @hnch/e2e run lint

      # node:test suite for packages/e2e/scripts (the static server that
      # serves the built client to Playwright).
      - name: Unit tests (e2e)
        run: pnpm --filter @hnch/e2e run test:unit

      # --with-deps apt-installs Chromium's system libraries.
      - name: Install Playwright browsers
        run: pnpm --filter @hnch/e2e exec playwright install --with-deps chromium

      # One Playwright session: the app tests and, with CAPTURE, the screenshot
      # specs beside them, writing docs/screenshots/sha-<short>/ in the
      # checkout (gitignored). A verified-skip main run has no app tests to
      # run and captures alone; the step continues on error there so the
      # steps below can upload the report and say what was missed.
      - name: Run e2e
        id: playwright
        continue-on-error: ${{ needs.detect-changes.outputs.e2e != 'true' }}
        run: |
          set -euo pipefail
          if [[ "$CAPTURE" == true ]]; then
            SCREENSHOT_SHA="sha-$(git rev-parse --short=7 HEAD)"
            export SCREENSHOT_CAPTURE=1 SCREENSHOT_SHA
            echo "SCREENSHOT_SHA=$SCREENSHOT_SHA" >> "$GITHUB_ENV"
            echo "Capturing main's screenshot reference as docs/screenshots/$SCREENSHOT_SHA/"
          fi
          if [[ "$E2E" == true ]]; then
            pnpm --filter @hnch/e2e test
          else
            pnpm --filter @hnch/e2e exec playwright test _screenshots --project chromium
          fi

      - name: Upload Playwright report
        if: failure() || steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7

      # The set is named only when the run passed and wrote images, so the
      # publish job never moves latest/ to a partial or empty set.
      - name: Name the captured reference set
        id: reference
        if: env.CAPTURE == 'true' && steps.playwright.outcome == 'success'
        run: |
          set -euo pipefail
          count=0
          if [[ -d "docs/screenshots/$SCREENSHOT_SHA" ]]; then
            count=$(find "docs/screenshots/$SCREENSHOT_SHA" -type f -name '*.png' | wc -l)
          fi
          if [[ "$count" -eq 0 ]]; then
            echo "::warning::Playwright passed but wrote no image under docs/screenshots/$SCREENSHOT_SHA/; nothing to publish."
            exit 0
          fi
          echo "$count images captured as $SCREENSHOT_SHA"
          echo "set=$SCREENSHOT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload the captured reference set
        if: steps.reference.outputs.set != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-reference
          path: docs/screenshots/${{ steps.reference.outputs.set }}
          if-no-files-found: error
          retention-days: 30

      # Runs after a failed Playwright step too (the job is red then), so the
      # summary names the miss either way.
      - name: Note a missed capture
        if: ${{ !cancelled() && env.CAPTURE == 'true' && steps.reference.outputs.set == '' }}
        run: |
          echo "::warning::main's screenshot reference was not captured in this run; the previous latest/ on the screenshots branch stays."
          echo "Screenshot reference **not captured** in this run (Playwright failed or wrote no image); the previous \`latest/\` on the \`screenshots\` branch stays." >> "$GITHUB_STEP_SUMMARY"

  # Publishes the reference set the e2e job captured on a main push to the
  # `screenshots` branch and moves latest/ (ADR-0057). Its own job because it
  # holds this workflow's only write token: it runs nothing from the tree under
  # test, only scripts/ci from the pushed main commit, and PR runs never reach
  # it. continue-on-error: a failed publish leaves the previous reference in
  # place and the main run green (release.yml starts from a green run); the
  # ::error:: annotation and the step summary show the miss.
  screenshots-reference:
    name: Publish the screenshot reference
    runs-on: ubuntu-24.04-arm
    needs: [detect-changes, e2e]
    if: github.event_name == 'push' && needs.e2e.outputs.reference != ''
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: write
    # Two main runs publish one after the other. The workflow-level group
    # still cancels this job with the rest of an older run when a newer push
    # lands; the newer run then publishes, and git push is atomic.
    concurrency:
      group: screenshots-reference
      cancel-in-progress: false
    steps:
      # main: the publisher script, and its history so latest/ only moves to
      # a commit at or past the one it shows (a re-run of an older run's
      # failed publish adds its set but leaves latest/ alone). Treeless, as in
      # detect-changes: commits and trees only, blobs for scripts/ci.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/ci
          persist-credentials: false

      # The screenshots branch: its tip commit, no history, and of its blobs
      # only latest/ (a few MB). The publisher adds the new set's directory to
      # the sparse cone, copies the capture in and pushes with GITHUB_TOKEN,
      # which contents: write above lets push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: screenshots
          path: .screenshots-branch
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: latest
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download the captured reference set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots-reference
          path: ${{ runner.temp }}/screenshots-reference

      - name: Publish to the screenshots branch
        env:
          SET: ${{ needs.e2e.outputs.reference }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/ci/screenshots-reference.mjs publish \
            --branch-dir .screenshots-branch \
            --set-dir "$RUNNER_TEMP/screenshots-reference" \
            --set "$SET" --commit "$GITHUB_SHA" --run-url "$RUN_URL" \
            --main-dir .
