name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed packages
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 1
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      relay: ${{ steps.filter.outputs.relay }}
      client: ${{ steps.filter.outputs.client }}
      cli: ${{ steps.filter.outputs.cli }}
      e2e: ${{ steps.filter.outputs.e2e }}
      root: ${{ steps.filter.outputs.root }}
      verify-packages: ${{ steps.filter.outputs.verify-packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            # Diff against the PR head SHA explicitly. actions/checkout for
            # pull_request events checks out `pull/N/merge` (a synthetic merge
            # of base+head). When the PR's branch content is already in main
            # (e.g. a parallel PR from the same branch was merged first), the
            # merge ref collapses to base and `base...HEAD` reports zero files —
            # which causes detect-changes to skip every lane on a real PR.
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # Defensive: if base is unset/zero (first push, force-push), assume everything changed.
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "No usable base SHA; treating as full-pipeline run."
            for v in shared relay client cli e2e root; do
              echo "$v=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          # Defensive: fork PRs don't auto-fetch the head SHA via refs/heads/*.
          # Fetch it on demand so the diff resolves.
          if ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            echo "Head SHA $head not in local clone; fetching."
            git fetch --no-tags origin "$head" || true
          fi

          changed=$(git diff --name-only "$base"..."$head")
          echo "Changed files between $base and $head:"
          echo "$changed"

          match() { echo "$changed" | grep -qE "$1"; }

          root=false
          shared=false
          relay=false
          client=false
          cli=false
          e2e=false

          if match '^(pnpm-lock\.yaml|package\.json|tsconfig.*\.json|\.github/workflows/)'; then
            root=true
          fi
          match '^packages/shared/' && shared=true || true
          match '^packages/relay/'  && relay=true  || true
          match '^packages/client/' && client=true || true
          match '^packages/cli/'    && cli=true    || true
          match '^packages/e2e/'    && e2e=true    || true

          # Reverse-deps: shared change fans into all consumers.
          if [[ "$shared" == "true" ]]; then
            relay=true; client=true; cli=true; e2e=true
          fi
          # client or relay change requires e2e.
          if [[ "$client" == "true" || "$relay" == "true" ]]; then
            e2e=true
          fi
          # Root files force the full pipeline.
          if [[ "$root" == "true" ]]; then
            shared=true; relay=true; client=true; cli=true; e2e=true
          fi

          for v in shared relay client cli e2e root; do
            echo "$v=${!v}" >> "$GITHUB_OUTPUT"
          done

          # Build a JSON array of packages whose verify lane should run.
          # The `verify` matrix consumes this directly so unrelated lanes
          # don't appear in the run at all (no fake-pass, no wasted runner slot).
          # Branch protection should target the `Verify` summary aggregator below,
          # not individual `Verify (X)` checks (which legitimately disappear on
          # unrelated PRs).
          pkgs=()
          [[ "$shared" == "true" ]] && pkgs+=('"shared"')
          [[ "$relay"  == "true" ]] && pkgs+=('"relay"')
          [[ "$client" == "true" ]] && pkgs+=('"client"')
          [[ "$cli"    == "true" ]] && pkgs+=('"cli"')
          ifs_old=$IFS; IFS=,; echo "verify-packages=[${pkgs[*]}]" >> "$GITHUB_OUTPUT"; IFS=$ifs_old

  verify:
    name: Verify (${{ matrix.package }})
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-latest"]') }}
    needs: detect-changes
    # Skip entire job when no relevant packages changed, AND when this is a
    # fork PR (defense in depth — keeps fork PRs off self-hosted runners).
    if: |
      needs.detect-changes.outputs.verify-packages != '[]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 3
    concurrency:
      group: verify-${{ github.ref }}-${{ matrix.package }}
      cancel-in-progress: true
    strategy:
      fail-fast: true
      # Matrix is computed dynamically from detect-changes — only lanes for
      # changed packages exist. Status checks for unrelated lanes don't appear
      # in the PR (cleaner than fake-passed). The `verify-summary` aggregator
      # below is the single check branch protection should target.
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.verify-packages) }}
    steps:
      - name: Runner identity
        run: |
          echo "Runner: $RUNNER_NAME on $(hostname) — arch $(uname -m)"
          df -h /cache || true

      - uses: actions/checkout@v4

      - name: Install
        uses: ./.github/actions/pnpm-install
        with:
          ignore-scripts: 'true'

      - name: Build @hnch/shared (consumed by other packages)
        run: pnpm --filter @hnch/shared run build

      - name: Typecheck
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present typecheck

      - name: Format check
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present format:check

      - name: Lint
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present lint

      - name: Lint templates
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present lint:templates

      - name: Unit tests (with coverage)
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.package }}
          files: packages/${{ matrix.package }}/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

      - name: Build
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present build

  # Aggregator for the verify matrix. Branch-protection rules (when configured)
  # should target this `Verify` check, not individual lanes. Passes when every
  # matrix lane either succeeded or was skipped; fails when any lane actually
  # failed/cancelled. This keeps the matrix gate honest (skipped is "skipped",
  # not fake-passed) while still giving branch protection a single target.
  verify-summary:
    name: Verify
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-latest"]') }}
    needs: verify
    if: always()
    timeout-minutes: 1
    steps:
      - name: Aggregate matrix result
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
        run: |
          case "$MATRIX_RESULT" in
            success|skipped)
              echo "verify matrix: $MATRIX_RESULT — OK"
              exit 0
              ;;
            *)
              echo "::error::verify matrix: $MATRIX_RESULT"
              exit 1
              ;;
          esac

  version-audit:
    name: Version audit
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          # Need tags so the audit script can compare package.json versions
          # against the highest released tag per package.
          fetch-depth: 0

      - name: Install
        uses: ./.github/actions/pnpm-install
        with:
          ignore-scripts: 'true'

      - name: Audit per-package versions vs git tags
        run: pnpm audit:versions

  pr-title-lint:
    name: PR title (Conventional Commits)
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-latest"]') }}
    if: github.event_name == 'pull_request'
    timeout-minutes: 1
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
          scopes: |
            client
            relay
            cli
            shared
            e2e
            ci
            docs
            infra
            deps
            repo

  e2e:
    name: E2E (Playwright)
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-latest"]') }}
    needs: [detect-changes, verify-summary]
    # `!failure() && !cancelled()` disables GitHub's default rule that auto-skips
    # a job when any transitive ancestor was skipped. For e2e-only PRs the
    # `verify` matrix legitimately skips (empty matrix), which previously
    # cascaded into e2e being skipped despite `verify-summary` succeeding.
    if: |
      !failure() && !cancelled() &&
      needs.detect-changes.outputs.e2e == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 10
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # E2E keeps default ignore-scripts=false: msgpackr-extract's native
      # binary is exercised by the relay + client at runtime.
      - name: Install
        uses: ./.github/actions/pnpm-install

      # On self-hosted (rootless container, no sudo) Playwright system deps are
      # baked into the image — plain `install chromium` is enough. On ubuntu-latest
      # we still need apt-get via `--with-deps`.
      - name: Install Playwright browsers (github-hosted)
        if: runner.environment == 'github-hosted'
        run: pnpm --filter @hnch/e2e exec playwright install --with-deps chromium

      - name: Install Playwright browsers (self-hosted)
        if: runner.environment == 'self-hosted'
        run: pnpm --filter @hnch/e2e exec playwright install chromium

      - name: Build @hnch/shared (consumed by relay + client webServers)
        run: pnpm --filter @hnch/shared run build

      - name: Run e2e
        run: pnpm --filter @hnch/e2e test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7
