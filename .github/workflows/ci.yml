name: CI

on:
  push:
    branches: [main]
    # Bot-authored screenshot refresh commits (see screenshots-main.yml) touch
    # only docs/screenshots/** and have no effect on any package lane. Skip
    # CI entirely on those pushes — saves a runner slot. Belt to the
    # GITHUB_TOKEN-push platform rule + [skip ci] trailer.
    paths-ignore:
      - 'docs/screenshots/**'
  pull_request:
    branches: [main]
    # Symmetric: a PR that only edits docs/screenshots/** can't affect any
    # package lane either. If you genuinely need a CI run for a screenshot-
    # only PR, touch any other path or run the workflow manually.
    paths-ignore:
      - 'docs/screenshots/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed packages
    runs-on: [self-hosted, linux, arm64, hnch-podman]
    # The checkout below is full-history and the pack is dominated by
    # docs/screenshots/** PNGs, so clone time grows with every screenshot
    # refresh commit. At timeout-minutes: 1 the job started dying mid-fetch
    # (successful runs were already landing at 40-53s). 3 minutes is headroom
    # on top of the blob filter, not a licence for the step to get slower.
    timeout-minutes: 3
    # Job-level permissions replace the workflow-level set, so contents: read
    # is restated. actions: read lets the filter step look up the last green
    # CI run on main.
    permissions:
      contents: read
      actions: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      relay: ${{ steps.filter.outputs.relay }}
      client: ${{ steps.filter.outputs.client }}
      cli: ${{ steps.filter.outputs.cli }}
      e2e: ${{ steps.filter.outputs.e2e }}
      root: ${{ steps.filter.outputs.root }}
      verify-packages: ${{ steps.filter.outputs.verify-packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: the filter step diffs base...head and
          # needs the merge-base. blob:none makes that a treeless partial
          # clone -- commits and trees, no file contents -- which is all the
          # path-only diff below reads. Drops the fetch from ~250 MiB of
          # screenshot blobs to ~1 MiB. NOTE: the diff MUST pass --no-renames,
          # or git's similarity detection lazy-fetches every changed blob back
          # from the promisor remote and the filter buys nothing.
          fetch-depth: 0
          filter: blob:none

      - id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # Every lane on. verify-packages must be emitted too: the verify
          # matrix fromJSON()s it and fails to expand on an empty string.
          # The ::warning:: annotation makes a fallback visible on the run
          # summary (a lost actions: read, a broken API, rewritten history).
          full_pipeline() {
            echo "$1"
            echo "::warning::$1"
            for v in shared relay client cli e2e root; do
              echo "$v=true" >> "$GITHUB_OUTPUT"
            done
            echo 'verify-packages=["shared","relay","client","cli","e2e"]' >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            # Diff against the PR head SHA explicitly. actions/checkout for
            # pull_request events checks out `pull/N/merge` (a synthetic merge
            # of base+head). When the PR's branch content is already in main
            # (e.g. a parallel PR from the same branch was merged first), the
            # merge ref collapses to base and `base...HEAD` reports zero files —
            # which causes detect-changes to skip every lane on a real PR.
            head="${{ github.event.pull_request.head.sha }}"
            main_push=false
          elif [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            # Push to main: diff from the last GREEN main run, not from
            # github.event.before. The workflow-level concurrency group cancels
            # an older main run when a newer merge lands; diffing only
            # before..sha would then skip the cancelled merge's lanes and go
            # green without ever testing it. Diffing from the last green run
            # covers every cancelled or failed merge since.
            # - The current run is in progress, not success, so the query
            #   never returns it.
            # - A failed run never becomes the base, so the next run re-tests
            #   its changes.
            # - Bot commits marked [skip ci] start no CI run of their own:
            #   screenshot refreshes (chore(screenshots): ...) and semantic-
            #   release's version bumps (chore(release): <tag>, which touch
            #   packages/<pkg>/package.json and CHANGELOG.md). They fall
            #   inside base..head, so the diff below is built per commit and
            #   leaves them out; otherwise a docs-only merge after a release
            #   would re-run that package's lanes.
            # - No green run found, gh failing, or a base that is not an
            #   ancestor of this push (history rewritten): full pipeline.
            main_push=true
            head="${{ github.sha }}"
            base=""
            last_url=""
            why="no last green main run found"
            if last=$(timeout 30 gh api \
                "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0] | select(. != null) | "\(.head_sha) \(.html_url)"'); then
              read -r base last_url <<< "$last" || true
            else
              why="querying the last green main run failed"
            fi
            if [[ -z "$base" ]]; then
              full_pipeline "fallback: full pipeline ($why)"
            fi
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "Base SHA $base not in local clone; fetching."
              timeout 30 git fetch --no-tags origin "$base" || true
            fi
            if ! git merge-base --is-ancestor "$base" "$head" 2>/dev/null; then
              full_pipeline "fallback: full pipeline (last green main run $last_url at $base is not an ancestor of $head)"
            fi
            echo "Base: last green main run $last_url ($base)"
          else
            # Unreachable today: the workflow triggers only on pull_request
            # and push to main. Kept as a guard should another trigger be
            # added; it falls back to diffing the push's own range.
            main_push=false
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # Defensive, for the guard branch above: an unset or zero base (e.g.
          # a new branch's first push) gives nothing to diff against, so run
          # everything.
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            full_pipeline "No usable base SHA; treating as full-pipeline run."
          fi

          # Defensive: fork PRs don't auto-fetch the head SHA via refs/heads/*.
          # Fetch it on demand so the diff resolves.
          if ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            echo "Head SHA $head not in local clone; fetching."
            git fetch --no-tags origin "$head" || true
          fi

          # --no-renames: keeps this a tree-only diff so the blob:none partial
          # clone above never has to lazy-fetch file contents. Rename detection
          # would only ever collapse an old+new path pair into the new path,
          # and for a path-prefix lane filter the extra old path is harmless.
          if [[ "$main_push" == "true" ]]; then
            # Per commit, minus the [skip ci] bot commits (see above), matched
            # on the subject only, as release.yml does: a body line must not
            # drop a human commit's files. main is squash-only and so linear.
            # Still tree-only: diff-tree --name-only never reads blobs.
            # Keep BOT_SUBJECT in step with release.yml.
            BOT_SUBJECT='^chore\((release|screenshots)\): .*\[skip ci\]$'
            # An assignment, not < <(...): errexit sees a failing git log.
            commits=$(git log --format='%H %s' "$base..$head")
            changed=""
            while read -r c subject; do
              [[ -z "$c" || "$subject" =~ $BOT_SUBJECT ]] && continue
              changed+=$(git diff-tree -r --no-commit-id --name-only --no-renames "$c")$'\n'
            done <<< "$commits"
            changed=$(sed '/^$/d' <<< "$changed" | sort -u)
          else
            changed=$(git diff --name-only --no-renames "$base"..."$head")
          fi
          echo "Changed files between $base and $head:"
          echo "$changed"

          # A herestring, not echo | grep -q: under pipefail, grep -q exiting on
          # the first hit can SIGPIPE echo on a long list and report no match.
          match() { grep -qE "$1" <<< "$changed"; }

          root=false
          shared=false
          relay=false
          client=false
          cli=false
          e2e=false

          if match '^(pnpm-lock\.yaml|package\.json|tsconfig.*\.json|\.github/workflows/)'; then
            root=true
          fi
          match '^packages/shared/' && shared=true || true
          match '^packages/relay/'  && relay=true  || true
          match '^packages/client/' && client=true || true
          match '^packages/cli/'    && cli=true    || true
          match '^packages/e2e/'    && e2e=true    || true
          # The relay and client deploy guards (and their tests) share
          # scripts/cloudflare/.
          if match '^scripts/cloudflare/'; then relay=true; client=true; fi
          # The relay lane runs its tests under scripts/ci/with-stall-sampler.sh.
          if match '^scripts/ci/'; then relay=true; fi

          # Reverse-deps: shared change fans into all consumers.
          if [[ "$shared" == "true" ]]; then
            relay=true; client=true; cli=true; e2e=true
          fi
          # relay change re-runs the CLI and shared suites, which test against
          # the relay through the @hnch/relay/testing harness. After the shared
          # block so it does not fan out to client/e2e via shared.
          if [[ "$relay" == "true" ]]; then
            cli=true; shared=true
          fi
          # client or relay change requires e2e.
          if [[ "$client" == "true" || "$relay" == "true" ]]; then
            e2e=true
          fi
          # Root files force the full pipeline.
          if [[ "$root" == "true" ]]; then
            shared=true; relay=true; client=true; cli=true; e2e=true
          fi

          for v in shared relay client cli e2e root; do
            echo "$v=${!v}" >> "$GITHUB_OUTPUT"
          done

          # Build a JSON array of packages whose verify lane should run.
          # The `verify` matrix consumes this directly so unrelated lanes
          # don't appear in the run at all (no fake-pass, no wasted runner slot).
          # Branch protection should target the `Verify` summary aggregator below,
          # not individual `Verify (X)` checks (which legitimately disappear on
          # unrelated PRs).
          pkgs=()
          [[ "$shared" == "true" ]] && pkgs+=('"shared"')
          [[ "$relay"  == "true" ]] && pkgs+=('"relay"')
          [[ "$client" == "true" ]] && pkgs+=('"client"')
          [[ "$cli"    == "true" ]] && pkgs+=('"cli"')
          [[ "$e2e"    == "true" ]] && pkgs+=('"e2e"')
          ifs_old=$IFS; IFS=,; echo "verify-packages=[${pkgs[*]}]" >> "$GITHUB_OUTPUT"; IFS=$ifs_old

  verify:
    name: Verify (${{ matrix.package }})
    runs-on: [self-hosted, linux, arm64, hnch-podman]
    needs: detect-changes
    # Skip entire job when no relevant packages changed, AND when this is a
    # fork PR (defense in depth — keeps fork PRs off self-hosted runners).
    if: |
      needs.detect-changes.outputs.verify-packages != '[]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 3
    concurrency:
      group: verify-${{ github.ref }}-${{ matrix.package }}
      cancel-in-progress: true
    strategy:
      fail-fast: true
      # Matrix is computed dynamically from detect-changes — only lanes for
      # changed packages exist. Status checks for unrelated lanes don't appear
      # in the PR (cleaner than fake-passed). The `verify-summary` aggregator
      # below is the single check branch protection should target.
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.verify-packages) }}
    steps:
      - name: Runner identity
        run: |
          echo "Runner: $RUNNER_NAME on $(hostname) — arch $(uname -m)"
          df -h /cache || true

      - uses: actions/checkout@v4

      - name: Install
        uses: ./.github/actions/pnpm-install
        with:
          ignore-scripts: 'true'

      - name: Build @hnch/shared (consumed by other packages)
        run: pnpm --filter @hnch/shared run build

      - name: Typecheck
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present typecheck

      - name: Format check
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present format:check

      - name: Lint
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present lint

      - name: Lint templates
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present lint:templates

      # The relay lane records PSI, load and CPU times while its tests run, to
      # tell a stalled runner VM from a slow test (#568).
      - name: Unit tests (with coverage)
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [[ "$PACKAGE" == relay ]]; then
            scripts/ci/with-stall-sampler.sh "$RUNNER_TEMP/stall-samples" \
              pnpm --filter ./packages/relay run test:coverage
          else
            pnpm --filter "./packages/$PACKAGE" run --if-present test:coverage
          fi

      - name: Upload stall samples
        if: always() && matrix.package == 'relay'
        uses: actions/upload-artifact@v4
        with:
          name: stall-samples-relay
          path: ${{ runner.temp }}/stall-samples/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.package }}
          files: packages/${{ matrix.package }}/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

      - name: Build
        run: pnpm --filter ./packages/${{ matrix.package }} run --if-present build

  # Aggregator for the verify matrix. Branch-protection rules (when configured)
  # should target this `Verify` check, not individual lanes. Passes when every
  # matrix lane either succeeded or was skipped; fails when any lane actually
  # failed/cancelled. This keeps the matrix gate honest (skipped is "skipped",
  # not fake-passed) while still giving branch protection a single target.
  verify-summary:
    name: Verify
    runs-on: [self-hosted, linux, arm64, hnch-podman]
    needs: verify
    if: always()
    timeout-minutes: 1
    steps:
      - name: Aggregate matrix result
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
        run: |
          case "$MATRIX_RESULT" in
            success|skipped)
              echo "verify matrix: $MATRIX_RESULT — OK"
              exit 0
              ;;
            *)
              echo "::error::verify matrix: $MATRIX_RESULT"
              exit 1
              ;;
          esac

  version-audit:
    name: Version audit
    runs-on: [self-hosted, linux, arm64, hnch-podman]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          # Need tags so the audit script can compare package.json versions
          # against the highest released tag per package.
          fetch-depth: 0

      - name: Install
        uses: ./.github/actions/pnpm-install
        with:
          ignore-scripts: 'true'

      - name: Audit per-package versions vs git tags
        run: pnpm audit:versions

  pr-title-lint:
    name: PR title (Conventional Commits)
    runs-on: [self-hosted, linux, arm64, hnch-podman]
    if: github.event_name == 'pull_request'
    timeout-minutes: 1
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
          scopes: |
            client
            relay
            cli
            shared
            e2e
            ci
            docs
            infra
            deps
            repo

  e2e:
    name: E2E (Playwright)
    # `e2e` is carried by exactly one pool runner (slot 1, see
    # infra/runner/supervisor.sh and ADR-0052), so Playwright jobs from
    # different refs, and screenshots-main.yml, queue behind each other instead
    # of sharing the runner VM's CPUs. timeout-minutes counts from job start,
    # not queue time.
    runs-on: [self-hosted, linux, arm64, hnch-podman, e2e]
    needs: [detect-changes, verify-summary]
    # `!failure() && !cancelled()` disables GitHub's default rule that auto-skips
    # a job when any transitive ancestor was skipped. For e2e-only PRs the
    # `verify` matrix legitimately skips (empty matrix), which previously
    # cascaded into e2e being skipped despite `verify-summary` succeeding.
    if: |
      !failure() && !cancelled() &&
      needs.detect-changes.outputs.e2e == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 10
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # E2E keeps default ignore-scripts=false: msgpackr-extract's native
      # binary is exercised by the relay + client at runtime.
      - name: Install
        uses: ./.github/actions/pnpm-install

      # On self-hosted (rootless container, no sudo) Playwright system deps are
      # baked into the image — plain `install chromium` is enough. On ubuntu-latest
      # we still need apt-get via `--with-deps`.
      - name: Install Playwright browsers (github-hosted)
        if: runner.environment == 'github-hosted'
        run: pnpm --filter @hnch/e2e exec playwright install --with-deps chromium

      - name: Install Playwright browsers (self-hosted)
        if: runner.environment == 'self-hosted'
        run: pnpm --filter @hnch/e2e exec playwright install chromium

      - name: Build @hnch/shared (consumed by relay + client webServers)
        run: pnpm --filter @hnch/shared run build

      - name: Run e2e
        run: pnpm --filter @hnch/e2e test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7
