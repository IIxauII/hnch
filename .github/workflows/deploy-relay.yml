name: Deploy relay

# Deploys hnch-relay (packages/relay) to Cloudflare Workers + Durable Objects
# (ADR-0051). Triggered when semantic-release cuts a `relay-vX.Y.Z` tag.
#
# Before the switch (repo variable HNCH_LIVE != 'true') the hnch.dev routes are
# deployed but inert, so the job only checks that the deploy took. After it,
# the job also smoke-tests https://hnch.dev.
#
# Rollback of code is `wrangler rollback`, never a re-dispatch of an old tag:
# the guard refuses to deploy a version older than the live one. Release rules
# (deploy coexistence, expand/contract): docs/deployment.md.

on:
  # Dispatched explicitly by semantic-release's publishCmd in
  # packages/relay/release.config.mjs (`gh workflow run deploy-relay.yml --ref
  # relay-vX.Y.Z`). Tag-push events from PATs are not reliably delivered to
  # other workflows, so dispatch is the canonical path. workflow_dispatch also
  # lets an operator re-deploy the latest tag from the Actions UI.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (defaults to current ref)'
        required: false
      allow_route_removal:
        description: 'Let this deploy remove a live hnch.dev route of hnch-relay'
        type: boolean
        default: false

# Serialize deploys of the relay.
concurrency:
  group: deploy-relay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy relay to Cloudflare
    runs-on: [self-hosted, linux, arm64, hnch-podman]
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Runner identity
        run: |
          echo "Runner: $RUNNER_NAME on $(hostname) — arch $(uname -m)"
          df -h /cache || true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install (cold, from a fresh store)
        # Not ./.github/actions/pnpm-install: the node_modules snapshots and the
        # pnpm store under /cache are shared with PR CI, which can write them,
        # and this job holds CLOUDFLARE_API_TOKEN. A store in RUNNER_TEMP
        # (emptied by the runner around every job) makes pnpm fetch each package
        # and check it against the lockfile's integrity hash. Linked: the relay,
        # what it depends on (shared), and the root's dev tools. The runner's
        # per-slot work dir is still shared with PR CI: see #558.
        run: >-
          pnpm install --frozen-lockfile --ignore-scripts
          --store-dir "${RUNNER_TEMP}/pnpm-store" --filter '@hnch/relay...'

      - name: Build @hnch/shared (bundled into the relay)
        run: pnpm --filter @hnch/shared run build

      - name: Relay version
        id: version
        run: echo "version=$(node -p "require('./packages/relay/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Assert production config
        # ADR-0027 test vars absent, JURISDICTION "eu", every route on hnch.dev
        # with a zone_id (the token has no Zone: Read).
        working-directory: packages/relay
        run: node scripts/deploy-guard.mjs config

      - name: Guard live routes and version
        # `wrangler deploy` deletes routes missing from the config: refuse
        # unless allow_route_removal. Refuse a version older than the live one.
        working-directory: packages/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOW_ROUTE_REMOVAL: ${{ inputs.allow_route_removal && 'true' || 'false' }}
        run: node scripts/deploy-guard.mjs live

      - name: Deploy
        working-directory: packages/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm exec wrangler deploy \
            --tag "relay-v${VERSION}" \
            --message "relay-v${VERSION} (${GITHUB_SHA::7})"

      - name: Check the deploy took
        working-directory: packages/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-guard.mjs verify

      - name: Smoke test hnch.dev
        # Only once the apex is proxied (Phase 3 sets HNCH_LIVE). DO code rolls
        # out gradually, so /health may answer the old version for a while.
        if: vars.HNCH_LIVE == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            served="$(curl -fsS --max-time 5 https://hnch.dev/health | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{}})' || true)"
            if [ "${served}" = "${VERSION}" ]; then
              echo "/health answers ${VERSION} (attempt ${attempt})"
              break
            fi
            if [ "${attempt}" = 30 ]; then
              echo "::error::/health answers '${served}', expected ${VERSION}"
              exit 1
            fi
            sleep 2
          done
          # Worker → Durable Object path: `0` is outside the code alphabet.
          status="$(curl -sS --max-time 10 -o /tmp/unknown-room.json -w '%{http_code}' https://hnch.dev/rooms/000000)"
          if [ "${status}" != 404 ] || ! grep -q '"reason":"unknown-room"' /tmp/unknown-room.json; then
            echo "::error::GET /rooms/000000 answered ${status}: $(cat /tmp/unknown-room.json)"
            exit 1
          fi
          echo "GET /rooms/000000 → 404 unknown-room"
