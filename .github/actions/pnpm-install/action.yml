name: pnpm install
description: |
  Set up Node 22 and pnpm (the version in package.json's `packageManager`, via
  Corepack), restore the pnpm store from the Actions cache, and run
  `pnpm install --frozen-lockfile`.

  The cache key is the lockfile hash. A run reads caches from its own ref and
  from main only, so a PR run, a fork's included, can never write a store that
  main reads. pnpm checks every package it links against the lockfile's
  integrity hash either way.

  Release and deploy jobs don't use this action: they install cold.

inputs:
  ignore-scripts:
    description: |
      Pass --ignore-scripts to pnpm install. Set to 'true' for lanes (verify)
      that don't exercise native postinstalls like msgpackr-extract.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore the pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.store.outputs.dir }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: pnpm install
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        set -euo pipefail
        FLAGS=(--frozen-lockfile)
        if [[ "${IGNORE_SCRIPTS}" == "true" ]]; then
          FLAGS+=(--ignore-scripts)
        fi
        pnpm install "${FLAGS[@]}"

    - name: Regenerate client version.ts
      shell: bash
      # packages/client has a postinstall (generate-version.mjs) that writes
      # src/environments/version.ts from git metadata. The --ignore-scripts
      # path skips it, so run it here every time; it takes ~0.3s.
      run: |
        if [[ -f packages/client/scripts/generate-version.mjs ]]; then
          node packages/client/scripts/generate-version.mjs
        fi
