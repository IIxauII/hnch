name: pnpm install
description: |
  Install Node and pnpm at mise.toml's versions (mise, checked against
  mise.lock), restore the pnpm store from the Actions cache, and run
  `pnpm install --frozen-lockfile`.

  The cache key is the lockfile hash. A run reads caches from its own ref and
  from main only, so a PR run, a fork's included, can never write a store that
  main reads. pnpm checks every package it links against the lockfile's
  integrity hash either way.

  Release and deploy jobs don't use this action: they install cold.

inputs:
  ignore-scripts:
    description: |
      Pass --ignore-scripts to pnpm install. Set to 'true' for lanes (verify)
      that don't exercise native postinstalls like msgpackr-extract.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # mise.lock is present, so the action runs `mise install --locked`: each
    # download is checked against the lockfile's checksum. No tool cache: a
    # restored cache is trusted as is, and the two downloads take seconds.
    # hk (git hooks) is not needed in CI.
    - name: Node and pnpm (mise)
      uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        version: 2026.11.10
        install_args: node pnpm
        cache: false

    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore the pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.dir }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: pnpm install
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        set -euo pipefail
        FLAGS=(--frozen-lockfile)
        if [[ "${IGNORE_SCRIPTS}" == "true" ]]; then
          FLAGS+=(--ignore-scripts)
        fi
        pnpm install "${FLAGS[@]}"

    - name: Regenerate client version.ts
      shell: bash
      # packages/client has a postinstall (generate-version.mjs) that writes
      # src/environments/version.ts from git metadata. The --ignore-scripts
      # path skips it, so run it here every time; it takes ~0.3s.
      run: |
        if [[ -f packages/client/scripts/generate-version.mjs ]]; then
          node packages/client/scripts/generate-version.mjs
        fi
